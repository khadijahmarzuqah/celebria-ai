kind = "web"
previewPath = "/"
title = "Celebria AI"
description = "A self-contained event-planning workspace for creating personalized celebration plans, managing budgets, schedules, and tasks, with browser-local persistence and no paid AI services."
version = "1.0.0"
id = "artifacts/celebria-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21193

[services.development]
run = "pnpm --filter @workspace/celebria-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/celebria-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/celebria-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21193"
BASE_PATH = "/"
